openapi: 3.0.3
info:
  title: GophProfile API
  description: |
    REST API для загрузки, хранения и раздачи аватарок.
    Изображения — JPEG, PNG, WebP, до 10 MB.
    Метрики Prometheus отдаются на отдельном порту (METRICS_ADDR, по умолчанию :9090) и в этой спецификации не описаны.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
  - url: http://avatars.example.com
    description: Kubernetes Ingress

tags:
  - name: avatars
  - name: users
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      summary: Readiness — проверка зависимостей
      description: PostgreSQL, S3 и RabbitMQ (если включён). 200 если всё ok, 503 если degraded.
      responses:
        "200":
          description: Все компоненты доступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Один или несколько компонентов недоступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/live:
    get:
      tags: [ops]
      summary: Liveness — процесс жив
      description: Зависимости не проверяются, поэтому недоступность S3 или базы не приводит к рестарту пода.
      responses:
        "200":
          description: Процесс отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /openapi.yaml:
    get:
      tags: [ops]
      summary: OpenAPI спецификация
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/avatars:
    post:
      tags: [avatars]
      summary: Загрузить аватар
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Аватар принят, обработка миниатюр идёт асинхронно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/avatars/{avatar_id}:
    get:
      tags: [avatars]
      summary: Получить изображение
      parameters:
        - $ref: "#/components/parameters/AvatarID"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Изображение. Cache-Control max-age=86400, ETag SHA-256
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: ETag совпал
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [avatars]
      summary: Удалить аватар
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/AvatarID"
      responses:
        "204":
          description: Удалён
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/avatars/{avatar_id}/metadata:
    get:
      tags: [avatars]
      summary: Метаданные аватара
      parameters:
        - $ref: "#/components/parameters/AvatarID"
      responses:
        "200":
          description: Метаданные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarMetadata"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{user_id}/avatar:
    get:
      tags: [users]
      summary: Аватар пользователя
      description: Если аватарки нет, возвращается встроенный placeholder (200, не 404).
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Изображение или placeholder
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: ETag совпал
    delete:
      tags: [users]
      summary: Удалить аватар пользователя
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Удалён
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{user_id}/avatars:
    get:
      tags: [users]
      summary: Список аватарок пользователя
      description: Пустой массив, если аватарок нет.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarList"

components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
        example: user@example.com
    AvatarID:
      name: avatar_id
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        example: user@example.com
    Size:
      name: size
      in: query
      schema:
        type: string
        enum: [original, 100x100, 300x300]
    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [jpeg, png, webp]
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string
        max_size:
          type: integer
          format: int64
    UploadResponse:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        url:
          type: string
        status:
          type: string
          example: processing
        created_at:
          type: string
          format: date-time
    AvatarMetadata:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        file_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        dimensions:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        thumbnails:
          type: array
          items:
            type: object
            properties:
              size:
                type: string
              url:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AvatarList:
      type: object
      properties:
        avatars:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              user_id:
                type: string
              file_name:
                type: string
              status:
                type: string
              url:
                type: string
              created_at:
                type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        components:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error]

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Аватар не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Можно удалять только свои аватарки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: Файл больше лимита
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Circuit breaker открыт или зависимость недоступна
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
