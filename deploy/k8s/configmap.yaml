apiVersion: v1
kind: ConfigMap
metadata:
  name: avatar-config
  namespace: avatar
  labels:
    app: avatar-service
    app.kubernetes.io/part-of: gophprofile
data:
  SERVER_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  BASE_URL: "http://avatars.example.com"
  MAX_UPLOAD_MB: "10"
  TRUSTED_PROXY_CIDRS: "10.42.0.0/16"
  POSTGRES_AUTO_MIGRATE: "true"
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "avatars"
  S3_USE_SSL: "false"
  S3_REGION: "us-east-1"
  RABBITMQ_ENABLED: "true"
  RABBITMQ_EXCHANGE: "avatars.exchange"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPS: "50"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_ENVIRONMENT: "kubernetes"
  OTEL_TRACING_ENABLED: "false"
  OTEL_TRACE_SAMPLE_RATIO: "1"
  OTEL_LOGS_ENABLED: "false"
  OTEL_METRICS_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  LOG_LEVEL: "info"
