dependencies:
  enabled: false

image:
  pullPolicy: IfNotPresent
  tag: "1.0.0"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

serviceMonitor:
  enabled: true

migrate:
  hook: pre-install,pre-upgrade

ingress:
  host: avatars.example.com

config:
  baseURL: https://avatars.example.com
  trustedProxyCIDRs: 10.0.0.0/8
  s3Endpoint: s3.example.com
  s3UseSSL: "true"
  otelEnvironment: production
  otelTracingEnabled: "false"
  otelLogsEnabled: "false"
  otelMetricsEnabled: "true"

secret:
  create: false
  existingSecret: avatar-secrets

networkPolicy:
  enabled: true
  externalEgress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
