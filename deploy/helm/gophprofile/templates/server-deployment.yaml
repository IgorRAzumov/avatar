apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.serverName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    {{- include "gophprofile.serverSelectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gophprofile.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "gophprofile.configChecksums" . | nindent 8 }}
      labels:
        {{- include "gophprofile.labels" . | nindent 8 }}
        {{- include "gophprofile.serverSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gophprofile.serverName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "gophprofile.name" . }}-config
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ include "gophprofile.serverName" . }}
            {{- include "gophprofile.secretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
