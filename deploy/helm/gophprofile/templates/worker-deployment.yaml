{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.workerName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    {{- include "gophprofile.workerSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "gophprofile.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "gophprofile.configChecksums" . | nindent 8 }}
      labels:
        {{- include "gophprofile.labels" . | nindent 8 }}
        {{- include "gophprofile.workerSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gophprofile.workerName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/worker"]
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "gophprofile.name" . }}-config
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ include "gophprofile.workerName" . }}
            {{- include "gophprofile.secretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
