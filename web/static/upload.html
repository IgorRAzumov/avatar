<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GophProfile — загрузка</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">GophProfile</h1>
        <p class="text-white/80 text-center mt-2">Загрузка аватарки</p>
      </header>

      <main class="p-6 space-y-6">
        <form id="uploadForm" class="space-y-4">
          <div>
            <label for="userId" class="block text-sm font-medium text-white mb-2">
              User ID (email) <span class="text-red-400">*</span>
            </label>
            <input type="text" id="userId" name="userId" required placeholder="user@example.com"
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500">
          </div>

          <div>
            <label for="file" class="block text-sm font-medium text-white mb-2">
              Изображение <span class="text-red-400">*</span>
            </label>
            <input type="file" id="file" name="file" accept="image/jpeg,image/png,image/webp" required
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer">
            <div id="imagePreview" class="mt-4 hidden">
              <img id="previewImg" src="" alt="Preview" class="w-32 h-32 object-cover rounded-lg shadow-lg mx-auto">
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:from-purple-700 hover:to-blue-700 disabled:opacity-50">
            <span id="btnText">Загрузить</span>
            <span id="btnLoader" class="hidden">Загрузка…</span>
          </button>
        </form>

        <div id="responseContainer" class="hidden border-t border-white/20 pt-6">
          <h2 class="text-xl font-semibold text-white mb-4">Ответ API</h2>
          <div id="responseStatus" class="px-4 py-3 rounded-lg font-mono text-sm mb-4"></div>
          <pre id="responseJson" class="bg-black/30 rounded-lg p-4 text-green-400 text-sm font-mono overflow-x-auto"></pre>
          <a id="galleryLink" href="#" class="hidden mt-4 inline-block text-purple-300 hover:text-white underline">
            Открыть галерею пользователя
          </a>
        </div>

        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg"></div>
      </main>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const responseContainer = document.getElementById('responseContainer');
    const responseStatus = document.getElementById('responseStatus');
    const responseJson = document.getElementById('responseJson');
    const galleryLink = document.getElementById('galleryLink');
    const errorMessage = document.getElementById('errorMessage');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          imagePreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        imagePreview.classList.add('hidden');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('userId').value.trim();
      const file = fileInput.files[0];
      if (!userId || !file) {
        showError('Заполните все поля');
        return;
      }

      setLoading(true);
      hideError();
      responseContainer.classList.add('hidden');
      galleryLink.classList.add('hidden');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/api/v1/avatars', {
          method: 'POST',
          headers: { 'X-User-ID': userId },
          body: formData,
        });

        const text = await response.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }

        displayResponse(response, data);
        if (response.ok) {
          galleryLink.href = '/web/gallery/' + encodeURIComponent(userId);
          galleryLink.classList.remove('hidden');
        }
      } catch (err) {
        showError('Ошибка сети: ' + err.message);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.classList.toggle('hidden', loading);
      btnLoader.classList.toggle('hidden', !loading);
    }

    function displayResponse(response, data) {
      responseContainer.classList.remove('hidden');
      const ok = response.ok;
      responseStatus.className = 'px-4 py-3 rounded-lg font-mono text-sm ' + (
        ok ? 'bg-green-500/20 border border-green-500/50 text-green-200'
           : 'bg-red-500/20 border border-red-500/50 text-red-200'
      );
      responseStatus.textContent = `HTTP ${response.status} ${response.statusText}`;
      responseJson.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
      if (!ok) showError(`Запрос завершился с ошибкой: ${response.status}`);
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }
  </script>
</body>

</html>
