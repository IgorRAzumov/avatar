version: "2"
run:
  timeout: 5m
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - misspell
    - noctx
    - unconvert
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - avatar
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
